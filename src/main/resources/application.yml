spring:
  application:
    name: team1-backend-integration
  jpa:
    hibernate:
      # create → update: 재시작해도 기존 데이터 유지
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

shopify:
  api-version: 2025-01

easypost:
  base-url: https://api.easypost.com

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always